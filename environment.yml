# Shot2EXR development environment (conda-forge only).
# Works on Rocky Linux 9 (linux-64, glibc 2.34; all packages need glibc >= 2.17)
# and Windows 10/11 (win-64). Create with:
#   conda env create -f environment.yml
name: shot2exr
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - numpy>=1.26
  - pyside6>=6.7,<6.12
  - py-openimageio>=3.0,<3.2
  - py-opencolorio>=2.4,<2.6
  - ffmpeg>=6.1
  - pytest>=8
