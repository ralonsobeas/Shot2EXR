# Shot2EXR default settings (shipped with the application).
# Override any value in your user settings file (shown by `shot2exr --env-info`), or point
# the SHOT2EXR_SETTINGS environment variable at another file. Tables are merged key by key.

[paths.windows]
projects_root = "T:/Volumes/Projects"

[paths.linux]
# Set this to the production storage mount point on Rocky Linux 9. Left empty on purpose:
# Shot2EXR refuses to build output paths until it is configured.
projects_root = ""

# Project code -> project folder name under projects_root.
[projects]
GOD = "GodOfTides"

# Task code -> task folder name under .../Tasks/.
[tasks]
ml = "MachineLearning"
